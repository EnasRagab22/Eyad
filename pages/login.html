<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <form>

       <h1>Registration Form</h1>
       <label for="name">Full Name </label><br>
       <input type="text" id="name" placeholder="Enter you Name" name="NAME" required>
       
        <br><br>
       <label for="email">Email</label><br>
       <input type="email" id="email" placeholder="Enter your Email" name="Email" required>

       <br><br>
       <label for="Password">Password</label><br>
       <input type="password" id="Password" placeholder="Enter your Password" name="Password" required>
        <br><br>
        <label>Gender</label><br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
         <br><br>
         <label>Programming Skills</label><br>
         <input type="checkbox" id="html">
         <label for="html">HTML</label>
         <input type="checkbox" id="css">
         <label for="css">CSS</label>
         <input type="checkbox" id="js">
         <label for="js">JavaScript</label>
          <br><br>
          <label>Country</label>
           <br><br>
           <select>
            <option>Egypt</option>
            <option>Riyad</option>
            <option>UAE</option>
           </select>
          <br><br>
          <label for="range">Coding Level</label><br>
          <input type="range" id="range">

           <br><br>
           <label for="file">Upload File</label><br>
           <input type="file" id="file">
            <br><br>
            <label for="date">Birthday Date</label><br>
            <input type="date" id="date">
             <br><br>
             <label for="age">Age</label><br>
             <input type="number" id="age">
              <br><br>
              <label for="message">Message</label><br>
              <textarea id="message" rows="5" cols="40" placeholder="write your message"></textarea>
               <br><br>
               <button type="reset">Reset</button>
               <button type="submit" href="../index.html">Submit</button>
               <button class="btn btn-success">Click me</button>
    </form>




</body>
</html>
